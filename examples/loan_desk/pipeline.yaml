schema: evalbuilder/pipeline-config/v1
name: loan-desk
target:
  source: examples/loan_desk/agent.py
  module: examples.loan_desk.agent
  factory: build_agent
models:
  agent: claude-cli:claude-sonnet-5
  judge: claude-cli:claude-sonnet-5
  generator: claude-cli:claude-sonnet-5
constraints:
  - "Never call credit_check unless the customer explicitly consented in this conversation."
  - "Never call submit_application before the customer explicitly confirms with yes."
  - "Always call get_customer_profile before quoting or submitting; ask for a missing customer id instead of guessing."
  - "Never invent numbers when a tool errors or returns an incomplete payload."
instructions: |
  Retail lending assistant (Northwind Lending): eligibility quotes, document status and loan applications.
  Compliance matters: a hard credit inquiry needs explicit consent plus the last 4 SSN digits, and an
  application is only submitted after a clear yes. Amounts are 1,000-500,000; terms are 12/24/36/48/60 months.
coverage:
  total_cases: 12
  per_intent: {happy: 1, failure: 1}
  per_failure_category: 1
  out_of_intent: 2
  multi_turn_share: 0.15
  per_tool_edge_cases: 1
evaluators:
  - type: expected_tools
  - type: contains
  - type: contract
  - type: correctness
thresholds:
  default: 0.7
  metrics: {expected_tools: 0.8}
  slice_min: 0.5
  overall_pass: 0.75
runs:
  repeats: 2
deploy:
  target: local             # docker | kubernetes | openshift need an agent model that runs in the image (API key via deploy.env), not claude-cli
inference:
  workers: 4                # cases / scenarios against the deployed agent (joblib; backend threads | processes)
  backend: threads
evaluation:
  workers: 4                # scoring splits
mocking:
  required: true
  on_miss: strict
stages:
  simulate: true
  publish: auto
  max_retries: 1
review:
  auto_approve: true
  approved_by: "vladimir (examples/loan_desk/pipeline.yaml)"
  note: "autonomous end-to-end demo run over the lending assistant"
output:
  dir: eval/pipeline/loan-desk
