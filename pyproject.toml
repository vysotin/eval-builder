[project]
name = "evalbuilder"
version = "0.1.0"
description = "Agentic eval/dataset builder for LangGraph agents"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain>=0.3",
  "openevals>=0.0.10",
  "agentevals>=0.0.5",
  "langsmith>=0.3",
  "typer>=0.12",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.scripts]
evalbuilder = "evalbuilder.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalbuilder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
