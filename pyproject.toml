[project]
name = "evalbuilder"
version = "0.1.0"
description = "Agentic eval/dataset builder for LangGraph agents"
requires-python = ">=3.11.7"
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain>=0.3",
  "openevals>=0.0.10",
  "agentevals>=0.0.5",
  "langsmith>=0.3",
  "typer>=0.12",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "langchain-claude-code-cli>=0.1.0",
]

[project.optional-dependencies]
# API-key LLM providers (alternatives to the claude-cli subscription adapter)
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]
gemini = ["langchain-google-genai>=2.0"]
llm = ["langchain-anthropic>=0.3", "langchain-openai>=0.3", "langchain-google-genai>=2.0"]
# Streamlit report UI (`evalbuilder ui`)
ui = ["streamlit>=1.40", "pandas>=2.0"]
# test tools, for plain pip installs: `pip install -e ".[ui,dev]"` (uv users get the `dev` dependency group)
dev = ["pytest>=8", "pytest-playwright>=0.5"]

[project.scripts]
evalbuilder = "evalbuilder.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-playwright>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalbuilder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ui: browser tests driving the Streamlit app with Playwright",
    "slow: end-to-end tests that spawn real pipeline subprocesses",
]
